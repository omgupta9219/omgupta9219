name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: omgupta9219
          outputs: |
            ./output/github-snake-dark.svg?palette=github-dark

      - name: Push Snake to output branch
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: output
          commit_message: "update snake"
