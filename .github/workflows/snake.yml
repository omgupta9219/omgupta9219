name: Snake + Auto Daily Commit

on:
  schedule:
    - cron: "0 0 * * *"      # Snake at midnight
    - cron: "0 5 * * *"      # Auto commit at 5 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:

  snake_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: omgupta9219
          outputs: |
            ./output/github-snake-dark.svg?palette=github-dark

      - name: Push snake files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update Snake"
          branch: output


  auto_commit_job:
    runs-on: ubuntu-latest
    needs: snake_job      # ← THIS LINE makes jobs run one-after-another (NO FAIL)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Daily Auto Commit
        run: |
          echo "Auto update on $(date)" >> daily-commit-log.txt

      - name: Commit and Push
        run: |
          git config --global user.email "omgupta9219@gmail.com"
          git config --global user.name "Om Gupta"
          git add .
          git commit -m "Daily auto commit [skip ci]" || echo "No changes"

      - name: Push to main
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
